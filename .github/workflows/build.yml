name: build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-appimage:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            git \
            clang \
            tcc \
            libsdl2-dev \
            libfuse2 \
            desktop-file-utils \
            xvfb \
            libgl1-mesa-dev

      - name: Install Spectre
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/src"
          git clone https://github.com/spectrelang/spectre.git "$HOME/.local/src/spectre"
          cd "$HOME/.local/src/spectre"
          export PATH="$HOME/.local/bin:$PATH"
          ./fw/install.sh -minimal

          export PATH="$HOME/.local/bin:$PATH"
          export YYJSON_DIR="$HOME/.local/src/yyjson"
          make
          /usr/bin/install -m 0755 ./spectre-dev "$HOME/.local/bin/spectre"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build emulator
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          spectre build release
          test -x ./chip8emu

      - name: Smoke test
        run: |
          set -euo pipefail
          python3 -c 'open("test.ch8", "wb").write(bytes([0x00, 0xE0, 0x12, 0x00]))'
          set +e
          SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy timeout 3 \
            xvfb-run -a ./chip8emu test.ch8
          status=$?
          set -e
          test "$status" -eq 124

      - name: Build AppImage
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/AppDir/usr/bin"
          cp ./chip8emu "$RUNNER_TEMP/AppDir/usr/bin/chip8emu"

          curl -fsSL -o "$RUNNER_TEMP/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/linuxdeploy"

          cd "$RUNNER_TEMP"
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/chip8emu \
            --desktop-file "$GITHUB_WORKSPACE/packaging/chip8emu.desktop" \
            --icon-file "$GITHUB_WORKSPACE/packaging/chip8emu.png" \
            --output appimage

          mv ./*.AppImage "$GITHUB_WORKSPACE/chip8emu-x86_64.AppImage"

      - name: Smoke test AppImage
        run: |
          set -euo pipefail
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 \
          SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy timeout 3 \
            xvfb-run -a ./chip8emu-x86_64.AppImage test.ch8
          status=$?
          set -e
          test "$status" -eq 124

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: chip8emu-linux-x86_64
          path: chip8emu-x86_64.AppImage
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Spectre
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/src"
          git clone https://github.com/spectrelang/spectre.git "$HOME/.local/src/spectre"
          cd "$HOME/.local/src/spectre"
          export PATH="$HOME/.local/bin:$PATH"
          ./fw/install.sh -minimal

          export PATH="$HOME/.local/bin:$PATH"
          export YYJSON_DIR="$HOME/.local/src/yyjson"
          make
          /usr/bin/install -m 0755 ./spectre-dev "$HOME/.local/bin/spectre"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install SDL2 and packaging tools
        run: |
          brew install sdl2 pkg-config dylibbundler

      - name: Build emulator
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          spectre build release
          test -x ./chip8emu

      - name: Bundle dylibs
        run: |
          set -euo pipefail
          mkdir -p dist/libs
          cp ./chip8emu dist/chip8emu
          dylibbundler -od -b \
            -x dist/chip8emu \
            -d dist/libs \
            -p @executable_path/libs/

      - name: Smoke test
        run: |
          set -euo pipefail
          python3 -c 'open("test.ch8", "wb").write(bytes([0x00, 0xE0, 0x12, 0x00]))'
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./dist/chip8emu test.ch8 &
          pid=$!
          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" || true
            echo "chip8emu exited during smoke test"
            exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true

      - name: Package
        run: |
          set -euo pipefail
          cd dist
          zip -r "../chip8emu-macos-${{ matrix.arch }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chip8emu-macos-${{ matrix.arch }}
          path: chip8emu-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 / MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-SDL2

      - name: Verify MinGW toolchain
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          export PATH="/mingw64/bin:/usr/bin:$PATH"
          gcc --version
          cc --version
          printf 'int main(void){return 0;}\n' > /tmp/toolchain_check.c
          gcc /tmp/toolchain_check.c -o /tmp/toolchain_check.exe
          /tmp/toolchain_check.exe

      - name: Build Spectre
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          export PATH="/mingw64/bin:/usr/bin:$PATH"
          command -v gcc
          gcc --version
          CC_PATH="$(cygpath -w "$(command -v x86_64-w64-mingw32-gcc || command -v gcc)")"
          mkdir -p "$HOME/.local/src" "$HOME/.local/bin"
          git clone https://github.com/spectrelang/spectre.git "$HOME/.local/src/spectre"
          git clone --depth 1 https://github.com/ibireme/yyjson.git "$HOME/.local/src/yyjson"

          cd "$HOME/.local/src/spectre"
          gcc -O2 -DYYJSON_STATIC -w -Wno-error=int-conversion \
            -c "$HOME/.local/src/yyjson/src/yyjson.c" -o "$HOME/.local/src/yyjson.o"
          gcc -O2 -w -Wno-error=int-conversion \
            -c spectrelib/csources/panic_handler.c -o "$HOME/.local/src/panic_handler.o"
          gcc -O2 -w -Wno-error=int-conversion \
            -I"$HOME/.local/src/yyjson/src" \
            -c spectrelib/csources/yyjson_shim.c -o "$HOME/.local/src/yyjson_shim.o"

          # Seed compiler from the checked-in bootstrap.
          mkdir -p "$HOME/.local/seed"
          gcc -O2 -static -w -Wno-error=int-conversion \
            bootstrap/sxcw.c \
            "$HOME/.local/src/panic_handler.o" \
            "$HOME/.local/src/yyjson_shim.o" \
            "$HOME/.local/src/yyjson.o" \
            -ldbghelp \
            -o "$HOME/.local/seed/spectre.exe"
          for dll in libgcc_s_seh-1.dll libwinpthread-1.dll libssp-0.dll; do
            if [ -f "/mingw64/bin/$dll" ]; then
              cp "/mingw64/bin/$dll" "$HOME/.local/seed/"
            fi
          done
          cp -r spectrelib "$HOME/.local/seed/spectrelib"
          "$HOME/.local/seed/spectre.exe" -v

          # Prove the seed compiler can invoke MinGW cc before rebuilding it.
          printf 'pub fn main() void = {}\n' > /tmp/seed_check.sx
          SEED_CHECK_SRC="$(cygpath -w /tmp/seed_check.sx)"
          SEED_CHECK_OUT="$(cygpath -w /tmp/seed_check.exe)"
          "$HOME/.local/seed/spectre.exe" "$SEED_CHECK_SRC" \
            --release --alt="$CC_PATH" -o "$SEED_CHECK_OUT"
          "$SEED_CHECK_OUT"

          # Rebuild the compiler from source so the CI compiler is current.
          # Force MinGW's cc; clang on the Windows PATH targets MSVC.
          COMPILER_SRC="$(cygpath -w "$HOME/.local/src/spectre/src/sxc.sx")"
          COMPILER_OUT="$(cygpath -w "$HOME/.local/bin/spectre.exe")"
          "$HOME/.local/seed/spectre.exe" "$COMPILER_SRC" \
            --release --alt="$CC_PATH" -o "$COMPILER_OUT"
          cp -r spectrelib "$HOME/.local/bin/spectrelib"
          for dll in libgcc_s_seh-1.dll libwinpthread-1.dll libssp-0.dll; do
            if [ -f "/mingw64/bin/$dll" ]; then
              cp "/mingw64/bin/$dll" "$HOME/.local/bin/"
            fi
          done
          "$HOME/.local/bin/spectre.exe" -v

          cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build emulator
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:/mingw64/bin:/usr/bin:$PATH"
          CC_PATH="$(cygpath -w "$(command -v x86_64-w64-mingw32-gcc || command -v gcc)")"

          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          cd "$WORKSPACE"
          spectre ./src/main.sx --release --dynamic --alt="$CC_PATH" -o chip8emu

          if [ -f chip8emu.exe ]; then
            exe=chip8emu.exe
          elif [ -f chip8emu ]; then
            exe=chip8emu
          else
            echo "chip8emu executable not found" >&2
            exit 1
          fi

          mkdir -p dist
          cp "$exe" dist/chip8emu.exe
          cp /mingw64/bin/SDL2.dll dist/SDL2.dll

          ldd dist/chip8emu.exe dist/SDL2.dll 2>/dev/null \
            | grep -o '/mingw64/bin/[^ ]*' \
            | xargs -r -n1 basename \
            | sort -u \
            | while read -r dll; do
                [ -f "/mingw64/bin/$dll" ] && cp "/mingw64/bin/$dll" dist/
              done

          zip -r chip8emu-windows-x86_64.zip dist

      - name: Smoke test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/mingw64/bin:/usr/bin:$PATH"
          WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          cd "$WORKSPACE"
          printf '\x00\xe0\x12\x00' > test.ch8

          cd dist
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./chip8emu.exe ../test.ch8 &
          pid=$!
          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" || true
            echo "chip8emu exited during smoke test" >&2
            exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chip8emu-windows-x86_64
          path: chip8emu-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux-appimage, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
